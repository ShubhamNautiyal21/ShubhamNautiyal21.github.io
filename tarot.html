<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- ✅ FIX: mobile scaling -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>✨ Tarot Reading ✨</title>

<style>
body {
  font-family: 'Georgia', serif;
  background: black;
  color: white;
  margin: 0;
  padding: 20px;
  overflow-x: hidden;
  text-align:center;

  /* ✅ responsive base font */
  font-size: 16px;
}

/* ✅ responsive text */
h1 {
  animation: glow 3s ease-in-out infinite alternate;
  font-size: clamp(28px, 6vw, 48px);
}

h2 {
  font-size: clamp(20px, 4.5vw, 28px);
}

p {
  font-size: clamp(16px, 4vw, 18px);
  line-height: 1.6;
}

/* stars */
body::before {
  content: "";
  position: fixed;
  width: 200%;
  height: 200%;
  background: radial-gradient(white 1px, transparent 1px);
  background-size: 40px 40px;
  opacity: 0.08;
  animation: moveStars 60s linear infinite;
  pointer-events: none;
}

@keyframes moveStars {
  from { transform: translate(0,0); }
  to { transform: translate(-500px, -500px); }
}

/* mist */
#mystic-bg {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  pointer-events:none;
  overflow:hidden;
  z-index:0;
}

.mist {
  position:absolute;
  width:200px;
  height:200px;
  background: radial-gradient(circle, rgba(255,255,255,0.1), transparent 70%);
  border-radius:50%;
  animation: floatMist linear infinite;
}

@keyframes floatMist {
  from { transform: translateY(100vh); opacity:0; }
  50% { opacity:0.2; }
  to { transform: translateY(-20vh); opacity:0; }
}

/* glow */
@keyframes glow {
  from { text-shadow: 0 0 5px white; }
  to { text-shadow: 0 0 20px white; }
}

/* intro */
#intro {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:black;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:10;
}

#intro p {
  max-width:500px;
  opacity:0.7;
  margin:20px;
}

/* ✅ improved button for mobile */
button {
  background:black;
  color:white;
  border:1px solid white;
  padding:14px 36px;
  border-radius:30px;
  cursor:pointer;
  transition:0.3s;
  font-size:16px;
}

button:hover {
  background:white;
  color:black;
  box-shadow:0 0 15px white;
}

/* layout */
.main { display:none; position:relative; z-index:1; }

.cards {
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
  margin-top:20px;
}

/* ✅ responsive cards */
.card {
  border:1px solid white;
  padding:15px;
  width: min(90vw, 220px);
  border-radius:20px;
  background: rgba(255,255,255,0.03);

  opacity:0;
  transform: translateY(20px);
  animation: fadeIn 1s forwards;
}

.card:nth-child(2){ animation-delay:0.2s; }
.card:nth-child(3){ animation-delay:0.4s; }

@keyframes fadeIn {
  to { opacity:1; transform:translateY(0); }
}

.section {
  background:rgba(255,255,255,0.05);
  padding:20px;
  margin:20px auto;
  max-width:800px;
  border-radius:20px;
}

/* ✅ small mobile tweaks */
@media (max-width: 600px) {
  body {
    padding: 14px;
  }

  .section {
    padding: 16px;
    margin: 14px auto;
  }

  .cards {
    gap: 14px;
  }
}

</style>
</head>

<body>

<div id="intro">
  <h1>✦ Tarot Reading ✦</h1>
  <p>
    Close your eyes. Think of something or someone you trust.  
    Hold your intention clearly… then enter to receive your answer.
  </p>
  <button onclick="start()">Enter</button>
</div>

<div class="main" id="main">

<div id="mystic-bg"></div>

<h1>🔮 Tarot Reading</h1>

<div class="cards" id="cards"></div>
<div class="section" id="reading"></div>

</div>

<script>

document.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    start();
  }
});
function start(){
  document.getElementById("intro").style.display="none";
  document.getElementById("main").style.display="block";
  createMist();
  draw(); 
}

function createMist(){
  const bg = document.getElementById("mystic-bg");
  for(let i=0;i<12;i++){
    let m=document.createElement("div");
    m.className="mist";
    m.style.left=Math.random()*100+"vw";
    m.style.animationDuration=(20+Math.random()*20)+"s";
    bg.appendChild(m);
  }
}

const deck = ["The Fool","The Magician","The High Priestess","The Empress","The Emperor",
"The Hierophant","The Lovers","The Chariot","Strength","The Hermit",
"Wheel of Fortune","Justice","The Hanged Man","Death","Temperance",
"The Devil","The Tower","The Star","The Moon","The Sun",
"Judgement","The World"];

const meanings = {
"The Fool":"beginnings, innocence, spontaneity, free spirit",
"The Magician":"manifestation, resourcefulness, power, inspired action",
"The High Priestess":"intuition, mystery, inner knowledge, subconscious",
"The Empress":"abundance, nurturing, fertility, creativity",
"The Emperor":"authority, structure, leadership, stability",
"The Lovers":"love, harmony, relationships, important choices",
"The Sun":"joy, success, vitality, clarity",
"The Moon":"illusion, fear, anxiety, subconscious mind",
"The Star":"hope, faith, healing, renewal",
"The Tower":"sudden upheaval, chaos, revelation, awakening"
};

const noCards = ["The Moon","The Tower"];

function buildReading(p, pr, f){
let m1 = meanings[p];
let m2 = meanings[pr];
let m3 = meanings[f];

return `<h2>Reading says</h2>
<p>${m1}, ${m2}, then ${m3}.</p>`;
}

function draw(){
let selected=[];
while(selected.length<3){
  let c=deck[Math.floor(Math.random()*deck.length)];
  if(!selected.includes(c)) selected.push(c);
}

document.getElementById("cards").innerHTML=
selected.map(c=>`<div class="card"><h3>${c}</h3></div>`).join("");

document.getElementById("reading").innerHTML=
buildReading(selected[0],selected[1],selected[2]);
}

</script>

</body>
</html>
