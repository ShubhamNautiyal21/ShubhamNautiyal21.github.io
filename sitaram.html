<style>
:root {
    --primary-color: #d84315;
    --secondary-color: #ffb300;
    --bg-color: #fff8e1;
    --card-bg: #ffffff;
    --text-color: #3e2723;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
}

.container {
    max-width: 650px;
    width: 100%;
    background: var(--card-bg);
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    border: 3px double var(--primary-color);
    text-align: center;
}

h1 {
    color: var(--primary-color);
    margin-bottom: 5px;
}

.subtitle {
    font-style: italic;
    margin-bottom: 20px;
}

input[type="text"] {
    width: 80%;
    padding: 12px;
    border: 2px solid var(--secondary-color);
    border-radius: 8px;
    font-size: 16px;
    text-align: center;
}

.grid-container {
    display: grid;
    grid-template-columns: repeat(15, 1fr);
    gap: 4px;
    margin: 20px 0;
    background: #ffecb3;
    padding: 8px;
    border-radius: 8px;
}

.cell {
    background: #fff;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;
    user-select: none;
    border: 1px solid #ffe082;

    /* ✅ FIX */
    font-size: clamp(10px, 2.5vw, 16px);
    line-height: 1;
    overflow: hidden;
    white-space: nowrap;
}

.cell:hover {
    background: var(--secondary-color);
    color: #fff;
}

.result-modal {
    display: none;
    margin-top: 20px;
    padding: 20px;
    background: #fbe9e7;
    border-left: 5px solid var(--primary-color);
    border-radius: 8px;
}

.prediction-badge {
    padding: 6px 15px;
    border-radius: 20px;
    font-weight: bold;
    margin-bottom: 10px;
    display: inline-block;
}

.status-good { background:#c8e6c9; }
.status-neutral { background:#fff9c4; }
.status-bad { background:#ffcdd2; }

button {
    margin-top: 15px;
    padding: 10px 20px;
    border: none;
    background: var(--primary-color);
    color: #fff;
    border-radius: 5px;
    cursor: pointer;
}
.instructions {
    background: #fff3cd;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
    font-size: 15px;
    line-height: 1.6;
}
@media (max-width: 480px) {
    .grid-container {
        gap: 2px;
        padding: 6px;
    }

    .cell {
        font-size: 10px;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>श्री राम शलाका प्रश्नावली  🙏</h1>
    <!-- <div class="subtitle">Meditate on Lord Rama, type your question, and select a letter below.</div> -->

        <div class="instructions">
        <b>Instructions:</b><br>
            1. Close your eyes<br>
            2. Think deeply about your question<br>
            3. Chant <b>Sita Ram</b> in your mind<br>
            4. Mentally rotate your hand over the grid 3 times<br>
            5. Open eyes and click ANY one box randomly
        </div>

    <div class="grid-container" id="shalakaGrid"></div>

    <div class="result-modal" id="resultBox">
        <div id="predictionBadge" class="prediction-badge"></div>
        <div id="chaupaiOutput" style="font-size:20px;font-weight:bold;"></div>
        <hr>
        <div id="meaningOutput"></div>
    
    </div>
</div>




<script>
const chaupais = [
    { 
        text: "सुनु सिय सत्य असीस हमारी। पूजिहि मन कामना तुम्हारी॥", 
        status: "good", 
        badge: "Highly Auspicious | सर्वसिद्धि", 
        meaning: "Deep Meaning: Spoken by Goddess Parvati to Sita. It means that when your devotion is pure and aligned with righteousness, cosmic energy will break its silence to grant your heart's deepest desires. Success is absolutely assured." 
    },
    { 
        text: "प्रबिसि नगर कीजै सब काजा। ह्रदयं राखि कोसलपुर राजा॥", 
        status: "good", 
        badge: "Auspicious | कार्य सिद्धि", 
        meaning: "Deep Meaning: Spoken by Lankini to Hanuman. It provides a formula for overcoming fear: if you anchor your mind to your inner moral compass and divine protection, even a hostile environment becomes safe for you to achieve victory." 
    },
    { 
        text: "उघरें अंत न होइ निबाहू। कालनेमि जिमि रावन राहू॥", 
        status: "bad", 
        badge: "Unfavorable | असफलता", 
        meaning: "Deep Meaning: Tulsidas warns that while deceit, false identities, or ill intentions (like those of Kalanemi, Ravana, and Rahu) can bring temporary wins, cosmic law ensures everything eventually crumbles into exposure and failure." 
    },
    { 
        text: "बिधि बस सुजन कुसंगत परहीं। फनि मनि सम निज गुन नहिं तहरहीं॥", 
        status: "bad", 
        badge: "Caution | कुसंगति से बचें", 
        meaning: "Deep Meaning: A snake is toxic, but the rare gemstone on its head remains pure. Similarly, if fate forces you into bad company or a tough situation, you must fiercely guard your inner values and avoid absorbing the toxicity around you." 
    },
    { 
        text: "होइहै सोई जो राम रचि राखा। को करि तरक बढ़ावै साखा॥", 
        status: "neutral", 
        badge: "Divine Will | ईश्वर इच्छा", 
        meaning: "Deep Meaning: Spoken by Lord Shiva. This teaches ultimate surrender and points out the futility of overthinking or anxiety. Do your best, stop arguing with destiny, and let things unfold according to the supreme cosmic design." 
    },
    { 
        text: "मुद मंगलमय संत समाजू। जो जग जंगम तीरथराजू॥", 
        status: "good", 
        badge: "Good Support | सहायता", 
        meaning: "Deep Meaning: Tulsidas compares a gathering of wise, noble souls to a moving holy pilgrimage. While a physical river cleanses the body, aligning with good advisors and wise company will immediately elevate your clarity and clear your path." 
    },
    { 
        text: "गरल सुधा रिपु करहिं मिताई। गोपद सिंधु अनल सितलाई॥", 
        status: "good", 
        badge: "Very Auspicious | संकट नाश", 
        meaning: "Deep Meaning: Hanuman feels this comfort inside enemy territory. When you act out of pure duty, the laws of the world bend in your favor: poison turns to nectar, massive problems shrink to the size of a puddle, and obstacles completely melt." 
    },
    { 
        text: "बरुन कुबेर सुरेस समीरा। रन सनमुख धरि सकहिं न धीरा॥", 
        status: "bad", 
        badge: "Delay & Dispute | भारी विरोध", 
        meaning: "Deep Meaning: This describes the overwhelming material strength of Ravana's army that shakes even the gods of nature. It indicates you are facing a massive, systemic obstacle right now; rushing forward with ordinary ego will not work." 
    },
    { 
        text: "सुफल मनोरथ होहुँ तुम्हारे। रामु लखनु सुनि भए सुखारे॥", 
        status: "good", 
        badge: "Wish Fulfilled | मनोकामना पूर्ण", 
        meaning: "Deep Meaning: Forest sages bless Rama and Lakshmana, bringing joy to the divine. It shows that when your intentions are righteous, the entire universe experiences a sense of harmony and naturally opens up the doors to fulfill your goals." 
    }
];


const gridLetters = Array(225).fill("राम");

const grid = document.getElementById("shalakaGrid");

gridLetters.forEach((letter, index) => {
    const div = document.createElement("div");
    div.className = "cell";
    div.innerText = letter;
    div.onclick = () => handleClick(index);
    grid.appendChild(div);
});

function handleClick(index) {
    

    const ch = chaupais[index % 9];

    chaupaiOutput.innerText = ch.text;
    meaningOutput.innerText = ch.meaning;

    predictionBadge.innerText = ch.badge;
    predictionBadge.className = "prediction-badge status-" + ch.status;

    resultBox.style.display = "block";
}

function resetApp() {
    questionInput.value = "";
    resultBox.style.display = "none";
}

         document.onkeydown = function(e) {
if(event.keyCode == 123) {
return false;
}
if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)){
return false;
}
if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)){
return false;
}
if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)){
return false;
}
if(e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)){
return false;
}
}

</script>
