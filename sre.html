<style>
:root {
  --bg-main: #090d16;
  --bg-surface: #111a2e;
  --bg-card: #1e293b;
  --neon-cyan: #00f2fe;
  --neon-blue: #4facfe;
  --neon-green: #00ff87;
  --neon-red: #ff5858;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Courier New', Courier, monospace;
}

body {
  background: var(--bg-main);
  background-image:
    radial-gradient(at 0% 0%, rgba(79, 172, 254, 0.1) 0px, transparent 50%),
    radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.1) 0px, transparent 50%);

  color: var(--text-main);

  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 10px;

  overflow: hidden;
}

.container {
  width: min(95vw, 1400px);
  height: 95vh;

  background: var(--bg-surface);
  padding: 24px;

  border-radius: 16px;
  border: 1px solid rgba(0, 242, 254, 0.2);
  box-shadow: 0 0 50px rgba(0, 242, 254, 0.1);

  position: relative;
  overflow: hidden;

  display: flex;
  flex-direction: column;
}

h1 {
  text-align: center;
  font-size: clamp(1.4rem, 2vw, 2rem);
  letter-spacing: 4px;
  background: linear-gradient(135deg, var(--text-main), var(--neon-cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 15px;
  text-transform: uppercase;
}

.stats {
  margin-bottom: 20px;
}
.card {
  background: rgba(30, 41, 59, 0.5);
  padding: 15px;
  border-radius: 8px;
  text-align: center;
  font-weight: bold;
  border: 1px solid rgba(255,255,255,0.05);
  font-size: 1.1rem;
}

.card span {
  color: var(--neon-cyan);
  display: block;
  font-size: 1.5rem;
  margin-top: 5px;
}

.word {
  width: 100%;
  text-align: center;

  font-size: clamp(24px, 2.5vw, 58px);

  font-weight: bold;
  line-height: 1.3;

  letter-spacing: 3px;

  color: var(--text-main);
  text-shadow: 0 0 10px rgba(255,255,255,0.2);

  white-space: normal;
  word-break: break-word;
}



.hints {
  flex-shrink: 0;
  margin-bottom: 20px;
}

.hints h3 {
  margin-bottom: 15px;
  color: var(--neon-cyan);
  font-size: 1.1rem;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.hint {
  margin: 12px 0;
  color: white;
  line-height: 1.4;
  font-size: 1.2rem;
}

.keyboard {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 8px;
}

@media (min-width: 1920px) {

  .container {
    max-width: 1700px;
  }

  .word {
    font-size: 72px;
  }

  .key {
    padding: 18px;
    font-size: 1.3rem;
  }
}


.key {
  padding: 14px 8px;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 6px;
  cursor: pointer;
  background: var(--bg-card);
  color: var(--text-main);
  font-size: 1.1rem;
  font-weight: bold;
  transition: all 0.2s ease;
}

.key:hover:not(:disabled) {
  background: var(--neon-blue);
  color: var(--bg-main);
  box-shadow: 0 0 15px var(--neon-blue);
  transform: translateY(-2px);
}

.key:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.correct {
  background: var(--neon-green) !important;
  color: var(--bg-main) !important;
  box-shadow: 0 0 15px var(--neon-green);
  border-color: var(--neon-green) !important;
}

.wrong {
  background: var(--neon-red) !important;
  color: var(--text-main) !important;
  box-shadow: 0 0 15px var(--neon-red);
  border-color: var(--neon-red) !important;
}

.result {
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  margin: 25px 0;
  min-height: 40px;
  letter-spacing: 1px;
}

.actions {
  display: flex;
  gap: 15px;
}

.actions button {
  flex: 1;
  padding: 16px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 1rem;
  font-weight: bold;
  letter-spacing: 2px;
  text-transform: uppercase;
  transition: all 0.3s ease;
}

.next {
  background: linear-gradient(135deg, var(--neon-blue), var(--neon-cyan));
  color: var(--bg-main);
}

.next:hover {
  box-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
  transform: scale(1.02);
}

.restart {
  background: transparent;
  color: var(--text-muted);
  border: 1px solid rgba(255,255,255,0.1);
}

.restart:hover {
  background: rgba(255,255,255,0.05);
  color: var(--text-main);
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}

.shake {
  animation: shake 0.3s ease;
}
</style>

let currentQuestion;
let guessedLetters=[];
let wrongAttempts=0;


function randomQuestion(){
return questions[Math.floor(Math.random()*questions.length)];
}

function startRound(){

currentQuestion=randomQuestion();
guessedLetters=[];
wrongAttempts=0;

document.getElementById("lives").textContent=3;
document.getElementById("result").textContent="";

document.getElementById("hint1").textContent=
"Hint 1: " + currentQuestion.hints[0];

document.getElementById("hint2").textContent=
"Hint 2: " + currentQuestion.hints[1];

document.getElementById("hint3").textContent=
"Hint 3: " + currentQuestion.hints[2];

document.getElementById("hint2").style.display="none";
document.getElementById("hint3").style.display="none";

generateKeyboard();
updateWord();
}

function updateWord() {

    let display = "";

    for (const char of currentQuestion.word) {

        if (char === " ") {

            display += "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;";

        } else if (guessedLetters.includes(char)) {

            display += char + " ";

        } else {

           display += "_ ";
        }
    }

    document.getElementById("word").innerHTML =
        display;

    checkWin();
}

function guess(letter,button){

if(guessedLetters.includes(letter)) return;

guessedLetters.push(letter);

if(currentQuestion.word.includes(letter)){

button.classList.add("correct");

updateWord();

}else{

button.classList.add("wrong");

wrongAttempts++;

let lives = Math.max(0, 3 - wrongAttempts);

document.getElementById("lives").textContent=lives;

if(wrongAttempts===1){
document.getElementById("hint2").style.display="block";
}

if(wrongAttempts===2){
document.getElementById("hint3").style.display="block";
}

if(wrongAttempts>=3){

document.getElementById("result").style.color =
    "var(--neon-red)";

document.getElementById("result").innerHTML =
    "INCIDENT FAILED<br><br>" +
    "Answer: <strong>" +
    currentQuestion.word +
    "</strong>";
disableKeyboard();
}
}

button.disabled=true;
}

function checkWin() {

    const answerLetters = [
        ...new Set(
            currentQuestion.word
                .replace(/\s/g, "")
                .split("")
        )
    ];

    const won = answerLetters.every(letter =>
        guessedLetters.includes(letter)
    );

    if (won) {

        document.getElementById("result").style.color =
            "var(--neon-green)";

        document.getElementById("result").innerHTML =
            "🎉 INCIDENT RESOLVED! 🎉<br><br>" +
            currentQuestion.word;

        disableKeyboard();
    }
}

function disableKeyboard(){

document
.querySelectorAll(".key")
.forEach(btn=>btn.disabled=true);
}

function generateKeyboard(){

    const keyboard =
        document.getElementById("keyboard");

    keyboard.innerHTML = "";

    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

    for(const char of chars){

        let btn = document.createElement("button");

        btn.className = "key";

        btn.textContent = char;

        btn.onclick = () => guess(char, btn);

        keyboard.appendChild(btn);
    }
}
